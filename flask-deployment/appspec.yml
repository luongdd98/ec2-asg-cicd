version: 0.0
os: linux
files:
  - source: app.py
    destination: /opt/flask-app
  - source: requirements.txt
    destination: /opt/flask-app
  - source: flask-app.service
    destination: /opt/flask-app
  - source: flask-app.conf
    destination: /opt/flask-app
permissions:
  - object: /opt/flask-app
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - directory
  - object: /opt/flask-app/app.py
    owner: ec2-user
    group: ec2-user
    mode: 644
    type:
      - file
hooks:
  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 300
      runas: root
